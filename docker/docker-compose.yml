version: '3.8'

services:
  # PostgreSQL数据库
  postgres:
    image: postgres:15-alpine
    container_name: openclaw-rag-postgres
    environment:
      POSTGRES_DB: openclaw_rag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - openclaw-network

  # Qdrant向量数据库
  qdrant:
    image: qdrant/qdrant:latest
    container_name: openclaw-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/readyz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openclaw-network

  # Redis缓存（单实例，精简版）
  redis:
    image: redis:7-alpine
    container_name: openclaw-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - openclaw-network

  # Neo4j知识图谱数据库
  neo4j:
    image: neo4j:5.20.0-community
    container_name: openclaw-rag-neo4j
    environment:
      NEO4J_AUTH: neo4j/graphrag123
      # 完全无参数，让Neo4j使用默认值
      NEO4J_ACCEPT_LICENSE_AGREEMENT: yes
      # 设置UTF-8编码支持中文
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7474"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - openclaw-network

  # 主应用服务（混合检索版本）
  app:
    image: openclaw-local-rag:latest
    container_name: openclaw-rag-app
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_healthy
      neo4j:
        condition: service_started  # 改为started，不要求健康检查
      tei-bge:
        condition: service_started
    environment:
      - APP_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=openclaw_rag
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      # TEI嵌入服务配置
      - EMBEDDING_PROVIDER=tei
      - TEI_BASE_URL=http://tei-bge:80
      - EMBEDDING_MODEL=BAAI/bge-small-zh-v1.5
      - EMBEDDING_DIMENSION=512
      # Docling离线模型配置
      - MODELS_ROOT=/app/models
      - DOCLING_DISABLE_MODEL_DOWNLOADS=1
      - RAPIDOCR_DISABLE_DOWNLOADS=1
      - HF_HUB_OFFLINE=1
      
      # Neo4j知识图谱配置
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=graphrag123
      - NEO4J_DATABASE=neo4j
      
      # DeepSeek模型
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-v4-flash}
      
      # GraphRAG配置
      - GRAPHRAG_ENABLED=${GRAPHRAG_ENABLED:-true}
      - RETRIEVAL_STRATEGY=${RETRIEVAL_STRATEGY:-hybrid}
      - GRAPH_RETRIEVAL_WEIGHT=${GRAPH_RETRIEVAL_WEIGHT:-0.2}
    volumes:
      - ../documents:/app/documents
      - ../logs:/app/logs
    ports:
      - "8000:8000"
    command: python src/main.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - openclaw-network

  # BGE嵌入服务（TEI）
  tei-bge:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.6
    container_name: tei-bge
    ports:
      - "8080:80"
    volumes:
      - bge_cache:/data
      - ../huggingface_cache/bge-small-zh-v1.5:/models/bge
    command: --model-id /models/bge
    environment:
      - MODEL_ID=BAAI/bge-small-zh-v1.5
      - PORT=80
    restart: unless-stopped
    networks:
      - openclaw-network

  # 可选：PGAdmin（数据库管理）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openclaw-rag-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@openclaw.local
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - openclaw-network

  # Prometheus 监控（从主应用 /metrics 抓取）
  prometheus:
    image: prom/prometheus:latest
    container_name: openclaw-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    networks:
      - openclaw-network

  # Jaeger 全链路追踪
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: openclaw-rag-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "4317:4317"     # OTLP gRPC
      - "4318:4318"     # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
    volumes:
      - jaeger_badger_data:/badger
    networks:
      - openclaw-network

  # Grafana 可视化面板
  grafana:
    image: grafana/grafana:latest
    container_name: openclaw-rag-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - openclaw-network

networks:
  openclaw-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  bge_cache:
  neo4j_data:
  neo4j_logs:
  neo4j_import:
  prometheus_data:
  grafana_data:
  jaeger_badger_data: